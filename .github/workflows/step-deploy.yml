name: "Step - Deploy Azure Web App .NET 10"

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      resource_group:
        required: true
        type: string
      slot-name:
        required: false
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  deploy:
    name: deploy-${{ inputs.env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    env:
      AZURE_WEBAPP_NAME: "local-sharp-ai-azure-webapp-${{ inputs.env }}"
      AZURE_WEBAPP_PACKAGE_PATH: 'artifacts/'

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure ASPNETCORE_ENVIRONMENT=Development on Web App
        env:
          AZURE_WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ inputs.resource_group }}
          AZURE_SLOT: ${{ inputs.slot-name }}
        run: |
          echo "Setting ASPNETCORE_ENVIRONMENT=Development for $AZURE_WEBAPP_NAME (resource group: $AZURE_RESOURCE_GROUP)"
          if [ -z "$AZURE_SLOT" ] || [ "$AZURE_SLOT" = "" ] || [ "$AZURE_SLOT" = "Production" ]; then
            az webapp config appsettings set --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --settings ASPNETCORE_ENVIRONMENT=Development
          else
            az webapp config appsettings set --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --slot "$AZURE_SLOT" --settings ASPNETCORE_ENVIRONMENT=Development
          fi

      - name: Download published artifacts
        uses: actions/download-artifact@v4
        with:
          name: "local_sharp_ai_artifacts"
          path: artifacts/

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
