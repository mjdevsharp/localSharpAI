global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'localsharpai-dev'
    environment: 'development'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s

  # OTel Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 10s

  # LocalSharpAi API metrics
  - job_name: 'localsharpai-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5000']
    scrape_interval: 15s
    scrape_timeout: 10s

  # Jaeger collector metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
    scrape_interval: 10s

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alert_rules.yml'
